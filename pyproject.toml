[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbguard"
version = "0.1.0"
description = "Destructive database operation detector and simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

[project.scripts]
dbguard = "dbguard.sim:main"
